# Builds the whole solution and runs every test on each push and pull request.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # WPF and the Windows registry code need a Windows machine.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and run tests
        run: dotnet test FocusLock.slnx --configuration Release
